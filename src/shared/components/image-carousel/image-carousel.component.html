<div class="relative h-full w-full group/carousel overflow-hidden rounded-2xl bg-gray-50">
  @for (img of images(); track $index) {
    <img
      [src]="img"
      [class.opacity-100]="currentIndex() === $index"
      [class.opacity-0]="currentIndex() !== $index"
      class="absolute inset-0 h-full w-full object-cover transition-opacity duration-500 group-hover:scale-110"
    />
  }

  @if (images().length > 1) {
    <div
      class="absolute inset-0 flex items-center justify-between px-2 opacity-0 group-hover/carousel:opacity-100 transition-opacity duration-300"
    >
      <button
        (click)="prev($event)"
        class="bg-white/90 p-1.5 rounded-full shadow-md hover:bg-white cursor-pointer active:scale-90 text-gray-700"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
      </button>
      <button
        (click)="next($event)"
        class="bg-white/90 p-1.5 rounded-full shadow-md hover:bg-white cursor-pointer active:scale-90 text-gray-700"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
      @for (img of images(); track $index) {
        <div
          [class]="currentIndex() === $index ? 'w-4 bg-indigo-600' : 'w-1.5 bg-gray-300'"
          class="h-1.5 rounded-full transition-all duration-300 shadow-sm"
        ></div>
      }
    </div>
  }
</div>
