<nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
  <div class="mx-auto px-4 sm:px-6 lg:px-8 bg-white/80">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer group"
        routerLink="/"
        (click)="closeMenu()"
      >
        <div
          class="bg-indigo-600 p-1.5 rounded-lg mr-2 group-hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200"
        >
          <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9 14.5c0 0 1 1 3 1s3-3 5-3"
            />
          </svg>
        </div>
        <span class="text-xl font-extrabold tracking-tight"
          >Filip <span class="text-indigo-600">Petrovski</span></span
        >
      </div>

      <div class="hidden md:flex space-x-8">
        <a
          routerLink="/products"
          routerLinkActive="text-indigo-600 border-b-2 border-indigo-600"
          class="text-gray-600 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors"
          >Products</a
        >
        <a
          routerLink="/about"
          routerLinkActive="text-indigo-600 border-b-2 border-indigo-600"
          class="text-gray-600 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors"
          >About Project</a
        >
        <a
          routerLink="/contact"
          routerLinkActive="text-indigo-600 border-b-2 border-indigo-600"
          class="text-gray-600 hover:text-indigo-600 px-3 py-2 text-sm font-medium transition-colors"
          >Contact</a
        >
      </div>

      <div class="flex items-center gap-3">
        <div
          class="relative p-2 text-gray-600 hover:text-indigo-600 transition-all cursor-pointer group"
          (click)="openCart()"
        >
          <svg
            class="h-7 w-7 transition-transform group-hover:scale-110"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
            />
          </svg>

          @if (cartCount() > 0) {
            <span
              class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/4 flex items-center justify-center min-w-[20px] h-5 px-1.5 text-[10px] font-black text-white bg-red-600 border-2 border-white rounded-full shadow-lg animate-in zoom-in duration-300"
            >
              {{ cartCount() }}
            </span>
          }
        </div>

        <button
          (click)="toggleMenu()"
          class="md:hidden p-2 rounded-xl text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer"
        >
          <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              [class.hidden]="isMenuOpen()"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
            <path
              [class.hidden]="!isMenuOpen()"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div
    [class.hidden]="!isMenuOpen()"
    class="absolute top-16 left-0 w-full bg-white border-b border-gray-200 shadow-2xl md:hidden z-50 animate-in fade-in slide-in-from-top-4 duration-300"
  >
    <div class="px-4 pt-4 pb-8 space-y-2">
      <a
        routerLink="/products"
        (click)="closeMenu()"
        class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-semibold text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-all cursor-pointer"
      >
        <span class="bg-gray-100 p-2 rounded-lg">📦</span> Products
      </a>
      <a
        routerLink="/about"
        (click)="closeMenu()"
        class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-semibold text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-all cursor-pointer"
      >
        <span class="bg-gray-100 p-2 rounded-lg">👋</span> About Project
      </a>
      <a
        routerLink="/contact"
        (click)="closeMenu()"
        class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-semibold text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-all cursor-pointer"
      >
        <span class="bg-gray-100 p-2 rounded-lg">✉️</span> Contact
      </a>
    </div>
  </div>
</nav>

@if (isMenuOpen()) {
  <div
    (click)="closeMenu()"
    class="fixed inset-0 top-16 bg-black/50 z-40 animate-in fade-in duration-200 cursor-pointer"
  ></div>
}
