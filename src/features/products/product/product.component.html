<div
  class="group relative bg-white border border-gray-100 rounded-3xl p-4 transition-all duration-500 hover:shadow-2xl hover:shadow-indigo-100 hover:-translate-y-2 flex flex-col h-full"
>
  <div class="relative aspect-square mb-4 overflow-hidden rounded-2xl bg-gray-50">
    <img
      [src]="product().thumbnail"
      [alt]="product().title"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
    />

    <div class="absolute top-3 right-3 z-10">
      <span
        [class]="
          product().isInStock()
            ? 'bg-white/90 text-green-600 backdrop-blur-md'
            : 'bg-white/90 text-red-600 backdrop-blur-md'
        "
        class="text-[10px] font-black px-3 py-1.5 rounded-xl uppercase tracking-widest shadow-sm border border-gray-100"
      >
        {{ product().isInStock() ? 'In Stock' : 'Out of Stock' }}
      </span>
    </div>

    @if (product().discountPercentage > 15) {
      <div class="absolute bottom-3 left-3">
        <span
          class="bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-tighter shadow-lg"
        >
          Sale
        </span>
      </div>
    }
  </div>

  <div class="flex flex-col flex-grow">
    <div class="mb-2">
      <h3
        class="text-lg font-bold text-gray-900 leading-tight group-hover:text-indigo-600 transition-colors"
        [title]="product().title"
      >
        {{ product().title }}
      </h3>
      <p class="text-xs text-gray-400 mt-2 line-clamp-2 leading-relaxed">
        {{ product().description }}
      </p>
    </div>

    <div class="mt-auto pt-6 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="text-[10px] font-black text-orange-600 px-2 py-0.5 bg-orange-50 rounded-lg">
            -{{ product().discountPercentage }}%
          </span>
          <span class="text-sm text-gray-300 line-through font-medium">${{ product().price }}</span>
        </div>
        <p class="text-2xl font-black text-indigo-600 tracking-tight">
          ${{ product().getFinalPrice().toFixed(2) }}
        </p>
      </div>

      <button
        class="bg-gray-900 hover:bg-indigo-600 text-white p-2.5 rounded-xl transition-all duration-200 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed shadow-lg shadow-gray-200 hover:shadow-indigo-200 active:scale-95"
        [disabled]="!product().isInStock()"
        (click)="onAddToCartClick()"
        [title]="product().isInStock() ? 'Add to cart' : 'Item out of stock'"
      >
        <svg
          xmlns="http://www.w3.org"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
